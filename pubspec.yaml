name: smart_travel_app
description: "Travel Plan - AI-powered road trip planner with weather, expenses and trip suggestions."
publish_to: 'none'

version: 2.1.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI / fonts / icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Networking / utils
  url_launcher: ^6.2.6
  http: ^1.1.0
  shared_preferences: ^2.2.3
  intl: ^0.18.0

  # Charts
  fl_chart: ^1.1.1

  # Gemini client (only one entry)
  google_generative_ai: ^0.4.7

  # Location & maps
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  latlong2: ^0.9.1

  # Firebase
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.1
  cloud_firestore: ^5.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
